<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L'imaginarium du Docteur Noirpeste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Alegreya:ital,wght@0,500;0,700;1,500&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Plan : la charte de la bannière officielle. Noir chaud, filets et ornements bronze, texte crème.
   Gothique (Pirata One) pour les grands titres comme « Docteur Noirpeste », serif Alegreya pour les titres courants,
   Cinzel espacé pour les étiquettes comme « SALLE DE JEUX DE RÔLE », Alegreya Sans pour lire. Thème sombre unique. */
:root{
  --ink:#0b0a08; --panel:#15120e; --panel-2:#1d1913; --line:#33291c;
  --bone:#ede5d3; --muted:#a89c86; --brass:#c8924a; --brass-deep:#7d5a2c; --on-brass:#1a1006;
  --ok:#8fb27a; --warn:#e07f45; --bad:#d06a5a; --info:#93b2c4;
  --f-display:"Pirata One", "UnifrakturCook", Georgia, serif;
  --f-fell:"Alegreya", Georgia, serif;
  --f-body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-label:"Cinzel", "Alegreya Sans", Georgia, serif;
  --r:6px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ink);color:var(--bone);font-family:var(--f-body);font-size:17px;line-height:1.5;
  background-image:radial-gradient(ellipse at 50% 0%, #1a150e 0%, transparent 55%);background-attachment:fixed;min-height:100vh}
h1,h2,h3{font-weight:400;text-wrap:balance;margin:0}
h2{font-family:var(--f-display);font-size:2.3rem;line-height:1.05;letter-spacing:.01em}
h3{font-family:var(--f-fell);font-weight:700;font-size:1.28rem;line-height:1.2}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.orn{display:flex;align-items:center;gap:10px;color:var(--brass)}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--brass-deep))}
.orn::after{background:linear-gradient(90deg,var(--brass-deep),transparent)}
.orn i{width:7px;height:7px;border-radius:50%;background:var(--brass);display:block}
p{margin:0}
a{color:var(--brass)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.label{font-family:var(--f-label);font-weight:500;letter-spacing:.14em;text-transform:uppercase;font-size:.72rem;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Bandeau démo */
.demo{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:center;padding:7px 16px;background:#22180c;color:#e7d3ad;font-size:.88rem;border-bottom:1px solid #4a3520}
.demo .seg{display:inline-flex;border:1px solid #6b5627;border-radius:999px;overflow:hidden}
.demo .seg button{background:none;border:0;padding:3px 12px;cursor:pointer;color:#e7d6a8}
.demo .seg button[aria-pressed="true"]{background:var(--brass);color:var(--on-brass);font-weight:700}
.demo .link{background:none;border:0;color:#e7d6a8;text-decoration:underline;cursor:pointer;padding:0}

/* En-tête */
header.top{position:sticky;top:0;z-index:20;background:rgba(11,10,8,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top .in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--bone);margin-right:auto}
.brand img{width:46px;height:46px;display:block}
.brand span{font-family:var(--f-fell);font-weight:500;font-size:.95rem;line-height:1;color:var(--muted)}
.brand b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.45rem;color:var(--bone);line-height:1.05}
nav.main{display:flex;gap:4px;flex-wrap:wrap}
nav.main a{text-decoration:none;color:var(--bone);padding:6px 12px;border-radius:999px;font-family:var(--f-label);font-weight:500;letter-spacing:.1em;font-size:.82rem;text-transform:uppercase}
nav.main a:hover{background:var(--panel-2)}
nav.main a[aria-current="page"]{background:var(--panel-2);color:var(--brass)}
nav.main a.mj{border:1px solid var(--brass-deep);color:var(--brass)}

main{max-width:1120px;margin:0 auto;padding:28px 16px 80px;display:grid;gap:40px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid transparent;border-image:linear-gradient(90deg,var(--brass-deep),var(--line) 40%,transparent) 1}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:var(--r);padding:9px 16px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;text-decoration:none;color:var(--bone);font-weight:500;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brass);border-color:var(--brass);color:var(--on-brass);font-weight:700}
.btn.primary:hover{background:#d8b25a}
.btn.ghost{background:none}
.btn.small{padding:5px 10px;font-size:.88rem}
.btn.danger{color:var(--bad);border-color:#5a2f29;background:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Pastilles */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font-family:var(--f-label);font-weight:500;font-size:.8rem;letter-spacing:.04em;border:1px solid currentColor;white-space:nowrap}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.info{color:var(--info)} .pill.brass{color:var(--brass)} .pill.mute{color:var(--muted)}
.pill.fill-ok{background:var(--ok);color:#13200f;border-color:var(--ok)}

/* Accueil */
.hero{display:grid;gap:22px;justify-items:center;text-align:center;padding-top:4px}
.hero .banner{width:100%;height:auto;display:block;border-radius:2px;aspect-ratio:1600/643;background:#0b0a08}
.hero p.lead{font-size:1.15rem;max-width:36em;color:#dcd3bf}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:var(--panel);border:1px solid var(--line);box-shadow:inset 0 0 0 4px var(--panel),inset 0 0 0 5px #241d13;border-radius:var(--r);padding:18px;display:grid;gap:8px;align-content:start}
.steps{counter-reset:s;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.steps .card h3::before{counter-increment:s;content:counter(s, upper-roman) ". ";color:var(--brass);font-family:var(--f-label)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.menu-list{display:grid;gap:2px}
.menu-list .it{display:flex;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px dotted var(--line)}
.menu-list .it .n{font-weight:500}
.menu-list .it .d{color:var(--muted);font-size:.92rem}
.menu-list .it .p{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--brass);white-space:nowrap}
.note{font-size:.88rem;color:var(--muted);font-style:italic}
.menu-cols{grid-template-columns:1fr 1fr;column-gap:40px}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.contact-card{grid-template-columns:auto 1fr;align-items:center;gap:16px;text-decoration:none;color:var(--bone)}
.contact-card:hover{border-color:var(--brass-deep)}
.contact-card svg{width:34px;height:34px;color:var(--brass)}
.contact-card b{display:block;font-family:var(--f-fell);font-weight:700;font-size:1.15rem;overflow-wrap:anywhere}

/* Planning */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:4px 12px;cursor:pointer;font-family:var(--f-label);font-weight:500;letter-spacing:.04em;font-size:.88rem;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--brass);color:var(--brass);background:#231e12}
.week{display:grid;gap:8px}
.week > .label{margin-top:8px}
.sess{display:grid;grid-template-columns:76px 136px 1fr auto;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:var(--r);padding:12px 16px;cursor:pointer;text-align:left;width:100%}
.sess .thumb{width:136px;aspect-ratio:16/9;border-radius:4px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(ellipse at 50% 40%,#1f1a12,#0d0b08);display:grid;place-items:center}
.sess .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.sess .thumb img.choix{object-position:center 40%}
.sess .thumb img.logo{width:38%;height:auto;opacity:.35;filter:grayscale(1)}
.sess.full .thumb img{filter:grayscale(.7)}
.sess:hover{background:var(--panel-2)}
.sess.t-ouverte{border-left-color:var(--info)}
.sess.t-privatisable{border-left-color:var(--brass)}
.sess.full{opacity:.62}
details.player{padding:0}
details.player>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px}
details.player>summary::-webkit-details-marker{display:none}
details.player>summary .sub{display:block;color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
details.player .pname{font-family:var(--f-fell);font-size:1.2rem}
details.player .pmini{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:.9rem}
details.player .pmini b{color:var(--bone)}
details.player[open]>summary{border-bottom:1px solid var(--line)}
details.player .pbody{padding:16px 18px;display:grid;gap:14px}
details.player h4{font-family:var(--f-label);font-weight:600;letter-spacing:.06em;font-size:.85rem;text-transform:uppercase;color:var(--brass);margin:0 0 8px}
.pcols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .pill{white-space:normal}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.plist li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted var(--line);padding:3px 0}
@media (max-width:700px){.pcols{grid-template-columns:1fr}}
.sess .thumb{position:relative}
.sess.st-option{border-left:3px dashed var(--warn)}
.sess.st-option.full{opacity:.85}
.sess.st-reservee{border-left-color:var(--bad);background:linear-gradient(90deg,rgba(208,106,90,.08),transparent 40%),var(--panel)}
.sess.st-reservee.full{opacity:.72}
.stamp{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.stamp span{font-family:var(--f-label);font-weight:700;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:#f3d9d2;background:rgba(120,30,22,.82);border:1px solid #e8a093;padding:3px 10px;transform:rotate(-8deg);box-shadow:0 2px 8px rgba(0,0,0,.5)}
.stamp span{white-space:nowrap}
.stamp.opt{place-items:end center;padding-bottom:6px}
.stamp.opt span{color:var(--warn);background:rgba(13,11,8,.82);border:1px dashed var(--warn);transform:none;letter-spacing:.04em;font-size:.62rem;padding:1px 6px;box-shadow:none}
.pill.fill-bad{background:var(--bad);color:#24100c;border-color:var(--bad);font-weight:700}
.pill.fill-warn{background:transparent;color:var(--warn);border-style:dashed}
.date{display:grid;justify-items:center;line-height:1}
.date .dw{font-family:var(--f-label);font-size:.78rem;color:var(--muted);letter-spacing:.08em}
.date .dd{font-family:var(--f-fell);font-weight:700;font-size:1.9rem}
.date .dm{font-family:var(--f-label);font-size:.78rem;color:var(--muted)}
.sess .t{font-family:var(--f-fell);font-weight:700;font-size:1.22rem;line-height:1.15}
.sess .meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:4px;color:var(--muted);font-size:.92rem}
.sess .right{display:grid;justify-items:end;gap:6px}
.pips{display:flex;gap:3px}
.pips i{width:10px;height:10px;border-radius:50%;border:1px solid var(--info);display:block}
.pips i.on{background:var(--info)}
.pips i.mine{background:var(--brass);border-color:var(--brass)}

/* Scénarios */
.scen-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.scen{display:flex!important;flex-direction:column;position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 14px;display:grid;gap:8px;align-content:start;cursor:pointer;text-align:left;width:100%}
.scen:hover{background:var(--panel-2)}
.scen.done{border-color:#3f5a3b}
.scen .sys{font-family:var(--f-label);font-size:.7rem;color:var(--brass);letter-spacing:.12em;text-transform:uppercase;margin-top:-4px}
.scen h3{padding-right:0}
.scen p{color:#cfc8b6;font-size:.95rem}
.scen .foot{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:.85rem;margin-top:4px}
.scen-img{position:relative;height:0;padding-bottom:56.25%;border:1px solid var(--brass-deep);border-radius:2px;background:radial-gradient(ellipse at 50% 40%,#1f1a12,#0d0b08);overflow:hidden;display:grid;place-items:center;box-shadow:inset 0 0 0 4px #0d0b08,inset 0 0 0 5px #3a2c18}
.scen-img img.pic{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.scen-img .ph{position:absolute;inset:0;display:grid;align-content:center;justify-items:center;gap:8px;color:var(--muted)}
.scen-img .ph img{width:56px;height:56px;opacity:.35;filter:grayscale(1)}
.scen-thumb{margin:-18px -18px 4px;aspect-ratio:16/9;overflow:hidden;border-bottom:1px solid var(--line);border-radius:var(--r) var(--r) 0 0}
.scen-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.img-edit{display:grid;gap:8px}
.scen .amb{font-family:var(--f-fell);font-style:italic;font-size:.95rem;color:var(--muted);margin-top:-6px}
.radio-cards.modes{grid-template-columns:repeat(3,1fr)}
@media (max-width:520px){.radio-cards.modes{grid-template-columns:1fr}}
.home-news{display:grid;grid-template-columns:minmax(220px,360px) 1fr;gap:28px;align-items:start}
section:not(.home-news) > figure.news{display:none}
.news{margin:0;display:grid;gap:8px}
.news-img{position:relative;aspect-ratio:4/5;width:100%;border:1px solid var(--brass-deep);border-radius:2px;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#1f1a12,#0d0b08);box-shadow:inset 0 0 0 4px #0d0b08,inset 0 0 0 5px #3a2c18}
.news-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.news-empty{display:grid;place-items:center;text-align:center;color:var(--muted);cursor:pointer;font:inherit;padding:20px}
.news-empty b{color:var(--brass);font-weight:500}
@media (max-width:820px){.home-news{grid-template-columns:1fr}.home-news .news{max-width:420px;width:100%;justify-self:center}}
.note-mj{color:var(--bad);font-weight:500}
.sfilters{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:end;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.sf{display:grid;gap:4px;min-width:150px;flex:1 1 150px;max-width:240px}
.sf select,.sf input{width:100%}
.sf-q{flex:2 1 220px;max-width:none}
.scen .dates{display:grid;gap:6px;margin-top:6px;padding-top:10px;border-top:1px dotted var(--line)}
.date-btn{display:flex;flex-direction:column;gap:1px;align-items:flex-start;width:100%;background:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:6px 10px;cursor:pointer;font-size:.92rem;text-align:left}
.date-btn > span:first-child{white-space:nowrap}
.date-btn:hover{border-color:var(--brass-deep);background:var(--panel-2)}
.d-info{color:var(--info);font-size:.85rem;white-space:nowrap}
.d-brass{color:var(--brass);font-size:.85rem;white-space:nowrap}
.tick{position:static;align-self:flex-end;margin-top:auto;padding-top:12px!important;z-index:1;display:flex;align-items:center;gap:8px;background:none;border:0;padding:2px;cursor:pointer;color:var(--ok)}
.tick .tbox{width:24px;height:24px;border-radius:4px;border:1.5px solid var(--muted);background:rgba(11,10,8,.6);display:grid;place-items:center;flex:none}
.tick:hover .tbox{border-color:var(--bone)}
.tick[aria-checked="true"] .tbox{background:var(--ok);border-color:var(--ok)}
.tick svg{width:16px;height:16px;opacity:0}
.tick[aria-checked="true"] svg{opacity:1}
.tick .played{display:none;align-items:center;gap:6px;font-family:var(--f-label);font-weight:600;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;padding:4px 10px 4px 9px;border:1px solid #4f6b44;border-radius:2px;background:linear-gradient(180deg,#1b2517,#141c11);box-shadow:inset 0 0 0 2px #141c11,inset 0 0 0 3px #2e4228;white-space:nowrap}
.tick .played::before,.tick .played::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--ok)}
.tick[aria-checked="true"] .played:not(.todo){display:inline-flex;animation:stamp .35s ease-out}
.tick[aria-checked="false"] .played.todo{display:inline-flex}
.tick .played.todo{color:var(--warn);border-color:#7a4424;background:linear-gradient(180deg,#2a1810,#1f120b);box-shadow:inset 0 0 0 2px #1f120b,inset 0 0 0 3px #4d2c18}
.tick .played.todo::before,.tick .played.todo::after{background:var(--warn)}
@keyframes stamp{from{opacity:0;transform:scale(1.25) rotate(-4deg)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.tick[aria-checked="true"] .played{animation:none}}

.tick svg{display:block}
.progress{height:6px;background:var(--panel-2);border-radius:999px;overflow:hidden}
.progress b{display:block;height:100%;background:var(--ok)}

/* Tiroir latéral */
.scrim{position:fixed;inset:0;background:rgba(5,7,6,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:41;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer .dh{display:flex;align-items:start;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer .dh h2{font-size:1.6rem;flex:1}
.drawer .db{padding:20px;overflow-y:auto;display:grid;gap:18px;align-content:start}
.x{background:none;border:1px solid var(--line);border-radius:var(--r);width:34px;height:34px;cursor:pointer;flex:none;font-size:1.2rem;line-height:1}
@media (prefers-reduced-motion: reduce){.drawer,.scrim{transition:none}}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:.95rem}
.facts dt{color:var(--muted);font-family:var(--f-label);letter-spacing:.04em}
.facts dd{margin:0}
.prose{display:grid;gap:10px;color:#d9d2c0}
.box{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;background:var(--panel-2)}
.box.brass{border-color:var(--brass-deep);background:#1f1b11}
.box.ok{border-color:#3f5a3b;background:#18211a}

/* Formulaires */
form{display:grid;gap:14px}
.field{display:grid;gap:5px}
.field label,.field .lbl{font-family:var(--f-label);font-weight:500;letter-spacing:.04em;font-size:.85rem;color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=time],input[type=tel],input[type=url],select,textarea{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
textarea{min-height:90px;resize:vertical}
.fields2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qty{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dotted var(--line)}
.qty .n{flex:1}
.qty .n small{display:block;color:var(--muted)}
.qty input{width:64px;text-align:center}
.radio-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.radio-cards label{border:1px solid var(--line);border-radius:var(--r);padding:10px;cursor:pointer;display:flex;gap:8px;align-items:center}
.radio-cards input:checked + span{color:var(--brass);font-weight:700}
.total{display:flex;justify-content:space-between;align-items:baseline;font-size:1.1rem;border-top:1px solid var(--line);padding-top:10px}
.total b{font-family:var(--f-fell);font-weight:700;font-size:1.6rem;color:var(--brass)}
.check{display:flex;gap:8px;align-items:center}

/* Compte & MJ */
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;cursor:pointer;font-family:var(--f-label);font-weight:500;letter-spacing:.04em;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--brass);border-bottom-color:var(--brass)}
.tabs .count{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--warn);color:#201006;font-size:.75rem;margin-left:4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat b{display:block;font-family:var(--f-fell);font-weight:700;font-size:2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.94rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-label);font-weight:500;letter-spacing:.05em;color:var(--muted);background:var(--panel);font-size:.82rem;white-space:nowrap}
tr:last-child td{border-bottom:0}
td .sub{color:var(--muted);font-size:.85rem}
.code-box .code{font-family:var(--f-label);font-weight:600;font-size:1.35rem;letter-spacing:.16em;color:var(--brass)}
.team{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}
.team li{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;padding:6px 0;border-bottom:1px dotted var(--line)}
.res-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--bone);color:var(--ink);padding:10px 18px;border-radius:999px;z-index:60;font-weight:500;box-shadow:0 6px 24px rgba(0,0,0,.4)}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:.88rem;text-align:center;padding:28px 16px;display:grid;gap:10px;justify-items:center}
footer img{width:96px;height:96px}

@media (max-width:820px){
  .sess{grid-template-columns:64px 104px 1fr;} .sess .thumb{width:104px} .sess .right{grid-column:2 / -1;justify-items:start;grid-auto-flow:column;justify-content:start;gap:12px;align-items:center}
  .split,.menu-cols,.contact{grid-template-columns:1fr}
  .grid3,.steps{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
}
@media (max-width:520px){
  .sess{grid-template-columns:56px 1fr;}
  .sess .thumb{grid-column:1 / -1;grid-row:1;width:100%;aspect-ratio:16/6}
  .sess .right{grid-column:1 / -1;justify-items:start;grid-auto-flow:column;justify-content:space-between;align-items:center}
  .fields2,.radio-cards{grid-template-columns:1fr}
  .date .dd{font-size:1.6rem}
}

.f-lab select{width:auto;min-width:120px;font-family:var(--f-body);font-size:.95rem;letter-spacing:0;text-transform:none;color:var(--bone)}

function updateTotal(){
  const f=$('#book'); const t=$('#b-total'); if(!f||!t) return;
  const places=+f.places.value; let tot;

    const unit=+t.dataset.prix; const bt=$('#b-table'); if(bt) bt.textContent=eur(unit*places)+' pour '+places+' joueurs'; tot=unit*k; }
  t.textContent=eur(tot+repasFormTotal(f));
}
async function book(e,sid){
  e.preventDefault(); const f=e.target; const s=D.planning.find(x=>x.id===sid); const btn=f.querySelector('[type=submit]');

  const sel=f.elements.scenario; if(sel&&sel.value) params.p_scenario=sel.value;
  if(s.type==='privatisable'){ params.p_parts=Math.min(places,Math.max(1,Math.round(+f.parts.value||1))); params.p_code=f.code.value; params.p_groupe=f.groupe.value.trim(); }

    const r=chk(await sb.rpc('book_session',params));
    const mode=f.mode?.value||'paypal'; if(mode!=='paypal') chk(await sb.rpc('set_mode_paiement',{p_id:r.id,p_mode:mode}));

/* ---------- Scénarios ---------- */
function vScenarios(){
  const u=D.profile; const f=UI.scenFilter;
  let list=D.scenarios.slice();
  if(u&&f==='faits') list=list.filter(s=>D.done.has(s.id));
  if(u&&f==='afaire') list=list.filter(s=>!D.done.has(s.id));
  const F=UI.sf; const norm=v=>String(v||'').trim().toLowerCase();
  const vals=k=>{const m=new Map(); D.scenarios.forEach(x=>{const v=String(x[k]||'').trim(); if(v&&!m.has(norm(v))) m.set(norm(v),v);}); return [...m.entries()].sort((a,b)=>a[1].localeCompare(b[1],'fr',{sensitivity:'base',numeric:true}));};
  if(F.genre) list=list.filter(s=>(s.genre||'scenario')===F.genre);
  ['systeme','niveau'].forEach(k=>{ if(F[k]) list=list.filter(s=>norm(s[k])===F[k]); });
  if(F.ambiance) list=list.filter(s=>plain(s.ambiance).includes(plain(F.ambiance)));
  const q=plain(UI.sq||'').trim();
  if(q){ const mots=q.split(/\s+/); list=list.filter(s=>{const t=plain([s.titre,s.systeme,s.ambiance,s.niveau,s.accroche,s.genre==='campagne'?'campagne':'scenario',s.pj].join(' ')); return mots.every(m=>t.includes(m));}); }
  const actifs=Object.values(F).some(Boolean)||!!q;
  const sel=(k,l,opts)=>`<label class="sf"><span class="label">${l}</span><select onchange="App.scenSF('${k}',this.value)"><option value="">Tous</option>${opts.map(([v,t])=>`<option value="${esc(v)}" ${F[k]===v?'selected':''}>${esc(t)}</option>`).join('')}</select></label>`;
  const hasCamp=D.scenarios.some(x=>x.genre==='campagne');
  const filtres=D.scenarios.length>1?`<div class="sfilters" role="group" aria-label="Filtrer les scénarios">
    <label class="sf sf-q"><span class="label">Rechercher</span><input id="scen-q" type="search" placeholder="Ex. horreur, Cthulhu, gobelins…" value="${esc(UI.sq||'')}" oninput="App.scenQ(this.value)" autocomplete="off"></label>
    ${hasCamp?sel('genre','Type',[['campagne','Campagnes'],['scenario','Scénarios']]):''}
    ${vals('systeme').length>1?sel('systeme','Système de jeu',vals('systeme')):''}
    ${vals('ambiance').length>1?sel('ambiance','Ambiance',vals('ambiance')):''}
    ${vals('niveau').length>1?sel('niveau','Niveau',vals('niveau')):''}
    ${actifs?`<button class="btn small ghost" type="button" onclick="App.scenSF(null)">Effacer les filtres</button>`:''}
  </div>`:'';
  const n=D.scenarios.filter(s=>D.done.has(s.id)).length;
  return `<section style="display:grid;gap:18px">
    <div class="sec-head"><div><h2>Scénarios disponibles</h2><p class="muted" style="margin-top:6px">${plural(D.scenarios.length,'scénario')} au catalogue. ${u?'Cochez ceux que vous avez déjà joués.':'<a href="#compte">Connectez-vous</a> pour cocher ceux que vous avez joués.'}</p></div>
    ${u?`<div class="filters" role="group" aria-label="Filtrer">${[['tous','Tous'],['afaire','Pas encore joués'],['faits','Déjà joués']].map(([k,l])=>`<button class="chip" type="button" aria-pressed="${f===k}" onclick="App.scenFilter('${k}')">${l}</button>`).join('')}</div>`:''}</div>
    ${u&&D.scenarios.length?`<div style="display:grid;gap:6px;max-width:420px"><span class="label">Votre parcours · <span class="num">${n} / ${D.scenarios.length}</span> joués</span><div class="progress"><b style="width:${n/D.scenarios.length*100}%"></b></div></div>`:''}
    ${filtres}${actifs?`<p class="muted num" style="margin-top:-6px">${plural(list.length,'scénario')} correspond${list.length>1?'ent':''} à vos filtres.</p>`:''}
    <div class="scen-grid">${list.map(scenCard).join('')||emptyBox(!D.scenarios.length?'Le catalogue arrive bientôt.':actifs?'Aucun scénario ne correspond à ces filtres. <button class="btn small" type="button" onclick="App.scenSF(null)">Effacer les filtres</button>':'Rien ici pour le moment.')}</div>

async function toggleDone(id,fromDrawer){
  if(!D.user) return; const had=D.done.has(id);
  had?D.done.delete(id):D.done.add(id); render(); if(fromDrawer) openScenario(id);

       else chk(await sb.from('scenario_done').insert({user_id:D.user.id,scenario_id:id})); }
  catch(e){ had?D.done.add(id):D.done.delete(id); render(); toast(errMsg(e)); }
}

function mjTotal(r){ const s=mjSess(r.session_id); if(!s) return repasSum(r.repas); const prix=Number(r.prix_session??s.prix); if(s.type==='ouverte') return prix*r.places+repasSum(r.repas); const o=r.parent_id?mjRes(r.parent_id):r; return prix*partsOf(r)+repasSum(r.repas); }
function mjTaken(o){ return partsOf(o)+D.mj.res.filter(x=>x.parent_id===o.id&&isActive(x)).reduce((a,x)=>a+partsOf(x),0); }
function vMJ(){
  const t=UI.mjTab;
  const pend=D.mj.res.filter(r=>r.statut==='option'&&isActive(r));
  const declared=pend.filter(r=>r.paiement_declare).length;
  const future=D.mj.sessions.filter(s=>s.date>Date.now());
  const placesConf=D.mj.res.filter(r=>r.statut==='confirmee'&&!r.parent_id&&(mjSess(r.session_id)?.date||0)>Date.now()).reduce((a,r)=>a+Number(r.places),0);
  const tabs=[['options','Options à valider',pend.length],['reservations','Toutes les réservations'],['planning','Planning'],['scenarios','Scénarios'],['joueurs','Joueurs'],['menu','Menu'],['news','Actualité'],['reglages','Réglages']];
  const body={options:mjOptions,reservations:mjReservations,planning:mjPlanning,scenarios:mjScenarios,joueurs:mjJoueurs,menu:mjMenu,news:mjNews,reglages:mjReglages}[t]();
  return `<section style="display:grid;gap:20px">
    <div class="sec-head"><div><span class="label">Espace MJ</span><h2>Le cabinet du docteur</h2></div><button class="btn small ghost" type="button" onclick="App.reload(this)">Actualiser</button></div>
    <div class="stats">
      <div class="stat"><span class="label">Options en attente</span><b>${pend.length}</b></div>
      <div class="stat"><span class="label">Paiements signalés</span><b style="color:var(--info)">${declared}</b></div>
      <div class="stat"><span class="label">Parties à venir</span><b>${future.length}</b></div>
      <div class="stat"><span class="label">Places confirmées</span><b>${placesConf}</b></div>
    </div>
    ${!D.settings.paypal||!D.mj.wero?`<div class="box brass"><p>${!D.settings.paypal&&!D.mj.wero?'Le lien PayPal et le numéro Wero ne sont pas encore renseignés':!D.settings.paypal?'Le lien PayPal n\'est pas encore renseigné':'Le numéro Wero n\'est pas encore renseigné'} : les joueurs qui choisissent ce moyen ne peuvent pas payer. <button class="btn small" type="button" onclick="App.mjTab('reglages')">Compléter</button></p></div>`:''}
    <div class="tabs" role="tablist">${tabs.map(([k,l,c])=>`<button role="tab" type="button" aria-selected="${t===k}" onclick="App.mjTab('${k}')">${l}${c?`<span class="count num">${c}</span>`:''}</button>`).join('')}</div>
    <div>${body}</div>
  </section>`;
}
function resRowMJ(r){
  const s=mjSess(r.session_id); const sc=s?scen(s.scenario_id||r.scenario_id||(r.parent_id?mjRes(r.parent_id)?.scenario_id:null)):null; const u=r.profiles||{pseudo:'?',email:''}; const o=r.parent_id?mjRes(r.parent_id):null; const tot=mjTotal(r);
  let pl=`<span class="num">${r.places}</span>`;
  if(s&&s.type==='privatisable'){
    if(r.parent_id) pl=`<span class="num">${plural(partsOf(r),'part')}</span><div class="sub">Table de ${esc(o?.profiles?.pseudo||'?')}</div>`;
    else pl=`<span class="num">${r.places} joueurs</span><div class="sub num">${plural(partsOf(r),'part')} · total ${mjTaken(r)}/${r.places}</div>${r.code?`<div class="sub">Code ${esc(r.code)}</div>`:''}`;
  }
  const mode=r.mode_paiement||'paypal';
  const pay=[['paypal','PayPal reçu'],['wero','Wero reçu'],['especes','Espèces reçues']].map(([k,l])=>`<button class="btn small ${k===mode?'primary':''}" type="button" onclick="App.validate(this,'${r.id}','${k}')">${l}</button>`).join('');
  return `<tr><td><b>${esc(u.pseudo)}</b>${r.groupe?`<div class="sub">${esc(r.groupe)}</div>`:''}<div class="sub">${esc(u.email)}</div></td>
    <td>${s?`${esc(sc?.titre||'?')}<div class="sub">${fDT(s.date)} · ${s.type==='ouverte'?'ouverte':r.parent_id?'rejoint une privatisation':'privatisation'}</div>`:'<span class="sub">Partie supprimée</span>'}</td>

    <td class="num">${eur(tot)}${tot>0?`<div class="sub">${MODES[mode]}</div>`:''}</td>
    <td><div class="row">${statusPill({...r,date:s?.date},tot)}</div></td>
    <td><div class="row">${r.statut==='option'&&isActive(r)?`<button class="btn small" type="button" onclick="App.validate(this,'${r.id}','')">Valider sans paiement</button>${tot>0?pay:''}`:''}${r.statut==='confirmee'&&!r.paye&&tot>0?pay:''}<button class="btn small ghost" type="button" onclick="App.editRes('${r.id}')">Modifier</button></div></td></tr>`;

const resTable=(rows,emptyMsg)=>rows.length?`<div class="tbl-wrap"><table><thead><tr><th>Joueur</th><th>Partie</th><th>Places</th><th>Repas</th><th>Montant</th><th>Statut</th><th>Actions</th></tr></thead><tbody>${rows.map(resRowMJ).join('')}</tbody></table></div>`:emptyBox(emptyMsg);
function mjOptions(){
  const pend=D.mj.res.filter(r=>r.statut==='option'&&isActive(r)).sort((a,b)=>(b.paiement_declare-a.paiement_declare)||(T(a.expires_at)-T(b.expires_at)));
  return `<div style="display:grid;gap:10px"><p class="muted">Les paiements signalés par les joueurs sont en tête, puis les options qui expirent le plus tôt. « Valider sans paiement » confirme la réservation tout de suite (habitués, règlement sur place) ; vous pourrez noter le paiement plus tard dans « Toutes les réservations ». « PayPal reçu » et « Espèces reçues » confirment et marquent payé.</p>${resTable(pend,'Aucune option en attente.')}</div>`;
}
function playerStats(u){
  const mine=D.mj.res.filter(r=>r.user_id===u.id);
  const conf=mine.filter(r=>r.statut==='confirmee');
  const past=conf.filter(r=>(mjSess(r.session_id)?.date||0)<=Date.now());
  const futur=conf.filter(r=>(mjSess(r.session_id)?.date||0)>Date.now());
  const paid=mine.filter(r=>r.paye).reduce((a,r)=>a+mjTotal(r),0);
  const due=conf.filter(r=>!r.paye).reduce((a,r)=>a+mjTotal(r),0);
  const food={}; let foodTot=0;
  conf.forEach(r=>(r.repas||[]).forEach(x=>{ food[x.nom]=(food[x.nom]||0)+Number(x.qty||0); foodTot+=Number(x.prix||0)*Number(x.qty||0); }));
  const done=D.mj.done.filter(d=>d.user_id===u.id).map(d=>scen(d.scenario_id)).filter(Boolean).sort((a,b)=>a.titre.localeCompare(b.titre,'fr'));
  const played=[...new Set(past.map(r=>{const s=mjSess(r.session_id); return scen(s?.scenario_id||r.scenario_id||(r.parent_id?mjRes(r.parent_id)?.scenario_id:null))?.titre;}).filter(Boolean))];
  return {mine,past,futur,paid,due,food,foodTot,done,played,last:past.map(r=>mjSess(r.session_id).date).sort((a,b)=>b-a)[0]};
}

  list.sort((a,b)=>sort==='parties'?b.st.past.length-a.st.past.length:sort==='depense'?b.st.paid-a.st.paid:sort==='recent'?T(b.u.created_at)-T(a.u.created_at):(a.u.pseudo||'').localeCompare(b.u.pseudo||'','fr'));

      <span class="pmini num"><span><b>${st.past.length}</b> partie${st.past.length>1?'s':''}</span><span><b>${eur(st.paid)}</b> réglé${st.due>0?` · <span style="color:var(--warn)">${eur(st.due)} à régler</span>`:''}</span><span><b>${st.done.length}</b>/${nScen} cochés</span></span>
    </summary>

        <div class="stat"><span class="label">À venir</span><b>${st.futur.length}</b></div>
        <div class="stat"><span class="label">Total réglé</span><b>${eur(st.paid)}</b></div>

      </div>
      <p class="muted" style="font-size:.92rem">Inscrit le ${u.created_at?fShort(u.created_at):'?'}${st.last?' · dernière partie le '+fShort(st.last):''} · <a href="mailto:${esc(u.email||'')}">Écrire</a></p>
      <div class="pcols">
        <div><h4>Scénarios cochés <span class="muted num">(${st.done.length}/${nScen})</span></h4>${st.done.length?`<div class="chips">${st.done.map(x=>`<span class="pill ok">${esc(x.titre)}</span>`).join('')}</div>`:'<p class="muted">Aucun.</p>'}
          ${st.played.length?`<h4 style="margin-top:12px">Joués à l'Imaginarium</h4><div class="chips">${st.played.map(t=>`<span class="pill brass">${esc(t)}</span>`).join('')}</div>`:''}</div>
        <div><h4>Ce qu'il a mangé</h4>${foods.length?`<ul class="plist">${foods.map(([n,q])=>`<li><span>${esc(n)}</span><b class="num">× ${q}</b></li>`).join('')}</ul>`:'<p class="muted">Rien pour l\'instant.</p>'}</div>
      </div>
      ${st.mine.length?`<div><h4>Ses réservations</h4>${resTable(st.mine.slice().sort((a,b)=>(mjSess(b.session_id)?.date||0)-(mjSess(a.session_id)?.date||0)),'')}</div>`:''}
    </div></details>`;
  };
  const sorts=[['pseudo','Pseudo'],['parties','Parties jouées'],['depense','Total réglé'],['recent','Inscription récente']];
  return `<div style="display:grid;gap:12px">
    <div class="row" style="justify-content:space-between;align-items:end">
      <div class="field" style="flex:1;min-width:220px;margin:0"><label for="pl-q">Rechercher un joueur</label><input id="pl-q" type="search" placeholder="Pseudo ou e-mail" value="${esc(UI.pq||'')}" oninput="App.playerQ(this.value)"></div>
      <div class="field" style="margin:0"><label for="pl-s">Trier par</label><select id="pl-s" onchange="App.playerSort(this.value)">${sorts.map(([k,l])=>`<option value="${k}" ${sort===k?'selected':''}>${l}</option>`).join('')}</select></div>
    </div>
    <p class="muted">${plural(list.length,'compte')} · parties et repas comptés sur les réservations confirmées.</p>
    ${list.map(card).join('')||'<p class="muted">Aucun joueur trouvé.</p>'}
  </div>`;
}

  const all=D.mj.res.slice().sort((a,b)=>(mjSess(b.session_id)?.date||0)-(mjSess(a.session_id)?.date||0));

async function saveRes(e,id){
  e.preventDefault(); const f=e.target; const btn=f.querySelector('[type=submit]'); const old=id?mjRes(id):null;
  const repas=[]; D.menu.filter(m=>!m.formule).forEach(m=>{const q=Math.round(+f['q-'+m.id].value||0); if(q>0){const prev=(old?.repas||[]).find(x=>x.id===m.id&&!x.choix); repas.push({id:m.id,nom:m.nom,prix:prev?prev.prix:m.prix,qty:Math.min(30,q)});}});
  readFormules(f).forEach(x=>{const m=D.menu.find(y=>y.id===x.id); if(m) repas.push({id:m.id,nom:m.nom,prix:formulePrix(m,x.choix.length),qty:1,choix:x.choix});});
  (old?.repas||[]).filter(x=>!D.menu.some(m=>m.id===x.id)).forEach(x=>repas.push(x));
  const moyen=f.moyen.value;
  const patch={user_id:f.user_id.value,session_id:f.session_id.value,places:Math.max(1,+f.places.value||1),parts:f.parts.value===''?null:Math.max(0,+f.parts.value),groupe:f.groupe.value.trim(),repas,statut:f.statut.value,
    expires_at:new Date(f.expires_at.value||Date.now()).toISOString(),paye:!!moyen,moyen,mode_paiement:f.mode_paiement.value,note:f.note.value.trim()};
  if(f.code) patch.code=f.code.value.trim()?f.code.value.trim().toUpperCase().replace(/\s+/g,'-'):null;
  await run(btn,async()=>{
    if(id){ chk(await sb.from('reservations').update(patch).eq('id',id));
      if(old&&old.session_id!==patch.session_id) chk(await sb.from('reservations').update({session_id:patch.session_id}).eq('parent_id',id)); }
    else chk(await sb.from('reservations').insert(patch));
    await refresh(); closeDrawer(); toast('Réservation enregistrée.');
  });
}
async function validate(btn,id,moyen){ const patch={statut:'confirmee'}; if(moyen){patch.paye=true; patch.moyen=moyen;}
  await run(btn,async()=>{ chk(await sb.from('reservations').update(patch).eq('id',id)); await refresh(); toast(moyen?({especes:'Confirmée, réglée en espèces.',paypal:'Confirmée, réglée par PayPal.',wero:'Confirmée, réglée par Wero.'}[moyen]):'Réservation validée sans paiement.'); }); }
async function extend(btn,id){ const r=mjRes(id); const exp=new Date(Math.max(T(r.expires_at),Date.now())+24*HOUR).toISOString();
  await run(btn,async()=>{ chk(await sb.from('reservations').update({expires_at:exp,statut:r.statut==='expiree'?'option':r.statut}).eq('id',id)); await refresh(); editRes(id); toast('Option prolongée de 24 h.'); }); }
async function delRes(btn,id){ const n=D.mj.res.filter(x=>x.parent_id===id).length; if(!confirm(n?`Supprimer cette réservation et les ${n} ami(s) qui ont rejoint la table ?`:'Supprimer cette réservation ?')) return;
  await run(btn,async()=>{ chk(await sb.from('reservations').delete().eq('id',id)); await refresh(); closeDrawer(); toast('Réservation supprimée.'); }); }

function mjPlanning(){
  const list=D.mj.sessions.slice().sort((a,b)=>a.date-b.date);
  const fut=list.filter(s=>s.date>=Date.now()-3*HOUR), past=list.filter(s=>s.date<Date.now()-3*HOUR).reverse();
  const row=s=>`<tr><td class="num">${fShort(s.date)}<div class="sub">${fTime(s.date)}</div></td><td>${esc(sessTitle(s))}${s.note?`<div class="sub">${esc(s.note)}</div>`:''}</td><td>${s.type==='ouverte'?'Ouverte':'Privatisable'}</td><td>${s.type==='ouverte'?`<span class="num">${s.pris} / ${s.places}</span>`:s.group_size?`<span class="num">${s.parts_taken} / ${s.group_size} parts</span>`:''} ${sessPill(s)}</td><td class="num">${eur(s.prix)}</td>

  const head='<thead><tr><th>Date</th><th>Scénario</th><th>Formule</th><th>Remplissage</th><th>Prix</th><th>Actions</th></tr></thead>';
  return `<div style="display:grid;gap:10px"><div class="row" style="justify-content:space-between"><p class="muted">« +7 j » recopie une partie à la semaine suivante, pour remplir le planning vite.</p><button class="btn primary small" type="button" onclick="App.editSess(null)" ${D.scenarios.length?'':'disabled title="Ajoutez d\'abord un scénario"'}>Ajouter une partie</button></div>
  ${!D.scenarios.length?'<p class="note">Ajoutez d\'abord un scénario dans l\'onglet Scénarios.</p>':''}
  ${fut.length?`<div class="tbl-wrap"><table>${head}<tbody>${fut.map(row).join('')}</tbody></table></div>`:emptyBox('Aucune partie à venir.')}
  ${past.length?`<details><summary class="label" style="cursor:pointer">Parties passées (${past.length})</summary><div class="tbl-wrap" style="margin-top:10px"><table>${head}<tbody>${past.map(row).join('')}</tbody></table></div></details>`:''}</div>`;
}
function editSess(id){
  const s=id?mjSess(id):{date:Date.now()+7*DAY,scenario_id:D.scenarios[0]?.id,type:'ouverte',places:6,prix:90,note:''};
  const pp=Number(D.settings.prix_place??20);

async function uploadImg(dataUrl,prefix=''){

  chk(await sb.storage.from('scenarios').upload(path,blob,{contentType:'image/jpeg',upsert:false}));
  return sb.storage.from('scenarios').getPublicUrl(path).data.publicUrl;
}

async function saveMenu(e,id){ e.preventDefault(); const f=e.target; const btn=f.querySelector('[type=submit]');
  const data={nom:f.nom.value.trim(),descr:f.descr.value.trim(),prix:Math.max(0,+f.prix.value||0),dispo:f.dispo.checked,position:Math.round(+f.position.value||0),formule:null};

    const paliers=f.paliers.value.split('\n').map(l=>l.match(/^\s*(\d+)\s*[=:]\s*([\d.,]+)/)).filter(Boolean).map(x=>({n:+x[1],prix:+x[2].replace(',','.')})).filter(p=>p.n>=1&&p.n<=12).sort((a,b)=>a.n-b.n);
    const choix=f.choix.value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const i=l.indexOf(':'); return i>0?{nom:l.slice(0,i).trim(),descr:l.slice(i+1).trim()}:{nom:l,descr:''};});
    if(!paliers.length){toast('Indiquez au moins un palier, par exemple « 1 = 5 ».');return;}
    if(!choix.length){toast('Indiquez au moins un choix.');return;}
    if(new Set(choix.map(c=>c.nom)).size!==choix.length){toast('Deux choix portent le même nom.');return;}
    data.formule={unite:f.unite.value.trim()||'Choix',paliers,choix}; data.prix=paliers[0].prix;
  }
  await run(btn,async()=>{ if(id) chk(await sb.from('menu_items').update(data).eq('id',id)); else chk(await sb.from('menu_items').insert(data)); await refresh(); closeDrawer(); toast('Menu mis à jour.'); }); }
